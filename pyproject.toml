[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sneak"
version = "0.1.0"
description = "Sneak custody connectors, score gate, LOMO and AoK helpers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
agent = ["band-sdk[langgraph]", "langchain-openai"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "apps/security-demo/src"]
