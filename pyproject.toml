[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sneak"
version = "0.1.0"
description = "Sneak custody connectors, score gate, LOMO and AoK helpers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "BiobitWorks and contributors" }]
dependencies = []

# Packaging SPDX applies to the installable software distribution.
# Repository non-code creative works use CC-BY-NC-ND-4.0 per LICENSE / LICENSING.md.

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "apps/security-demo/src"]
